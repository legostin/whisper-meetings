[project]
name = "whisper-meetings"
version = "0.3.0"
description = "Local meeting capture and Whisper transcription for Codex"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp>=1.26,<2", "faster-whisper>=1.2.1,<2", "av>=16,<17", "jsonschema>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
