name: Validate plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/whisper-meetings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run pytest
      - run: python scripts/build_ui.py
      - run: git diff --exit-code -- web/dist/widget.html THIRD_PARTY_NOTICES.md
      - run: uv run python ../../scripts/validate.py
      - run: python ../../scripts/package.py
